<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Cron Rhythm Studio | Visual Schedule & Rhythm Heatmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --md-primary: #1a73e8;
      --md-on-primary: #ffffff;
      --md-primary-container: #d2e3fc;
      --md-on-primary-container: #0d47a1;
      --md-surface: #f8f9fa;
      --md-surface-card: #ffffff;
      --md-on-surface: #202124;
      --md-on-surface-variant: #5f6368;
      --md-outline: #dadce0;
      --md-success: #1e8e3e;
      --md-success-container: #ceead6;
      --md-error: #d93025;
      --md-warning: #f29900;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
      --font-google: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Roboto Mono', monospace;
    }
    [data-theme="dark"] {
      --md-primary: #8ab4f8;
      --md-on-primary: #174ea6;
      --md-primary-container: #1a73e8;
      --md-on-primary-container: #d2e3fc;
      --md-surface: #202124;
      --md-surface-card: #292a2d;
      --md-on-surface: #e8eaed;
      --md-on-surface-variant: #9aa0a6;
      --md-outline: #5f6368;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-google);
      background: var(--md-surface);
      color: var(--md-on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--md-surface-card);
      border-bottom: 1px solid var(--md-outline);
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #1a73e8, #34a853);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .main-container {
      max-width: 1200px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .card {
      background: var(--md-surface-card);
      border: 1px solid var(--md-outline);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .input-group {
      display: flex;
      gap: 0.8rem;
      margin-top: 0.8rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.8rem 1rem;
      font-family: var(--font-mono);
      font-size: 1.1rem;
      border: 1px solid var(--md-outline);
      border-radius: var(--radius-sm);
      background: var(--md-surface);
      color: var(--md-on-surface);
    }
    button {
      padding: 0.8rem 1.5rem;
      background: var(--md-primary);
      color: var(--md-on-primary);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 500;
      font-family: var(--font-google);
    }
    .human-box {
      margin-top: 1rem;
      padding: 1rem;
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      border-radius: var(--radius-sm);
      font-size: 1.1rem;
      font-weight: 500;
    }
    .matrix-view {
      font-family: var(--font-mono);
      white-space: pre;
      overflow-x: auto;
      background: #1e1e1e;
      color: #76ea8f;
      padding: 1rem;
      border-radius: var(--radius-sm);
      margin-top: 0.8rem;
    }
    .runs-list {
      list-style: none;
      margin-top: 0.8rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.5rem;
    }
    .runs-list li {
      padding: 0.6rem 0.8rem;
      background: var(--md-surface);
      border: 1px solid var(--md-outline);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.9rem;
    }
    .theme-toggle {
      background: transparent;
      color: var(--md-on-surface);
      border: 1px solid var(--md-outline);
      padding: 0.4rem 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">⏱</div>
      <div>
        <h2>Google Cron Rhythm Studio</h2>
      </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">🌓 Theme</button>
  </header>

  <div class="main-container">
    <div class="card">
      <h3>Cron Expression</h3>
      <div class="input-group">
        <input type="text" id="cronInput" value="*/15 9-17 * * 1-5" placeholder="e.g. 0 0 * * *">
        <button onclick="evaluateCron()">Evaluate</button>
      </div>
      <div id="humanSummary" class="human-box">Every 15 minutes, between 09:00 and 17:59, Monday through Friday</div>
    </div>

    <div class="card">
      <h3>Weekly Rhythm Matrix (Heatmap)</h3>
      <div id="matrixDisplay" class="matrix-view">Loading weekly rhythm matrix...</div>
    </div>

    <div class="card">
      <h3>Next 5 Executions</h3>
      <ul id="runsList" class="runs-list">
        <li>Calculating...</li>
      </ul>
    </div>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    async function evaluateCron() {
      const expr = document.getElementById('cronInput').value.trim();
      try {
        const res = await fetch('/api/evaluate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({expression: expr})
        });
        const data = await res.json();
        if (data.human) {
          document.getElementById('humanSummary').textContent = data.human;
        }
        if (data.matrix_ascii) {
          document.getElementById('matrixDisplay').textContent = data.matrix_ascii;
        }
        if (data.next_runs) {
          const list = document.getElementById('runsList');
          list.innerHTML = data.next_runs.map(r => `<li>🕒 ${r}</li>`).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    // Auto-run on load
    window.addEventListener('load', evaluateCron);
  </script>
</body>
</html>
